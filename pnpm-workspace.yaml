packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.6"
  - "@biomejs/cli-android-arm64@2.6.6"
  - "@biomejs/cli-android-x64@2.6.6"
  - "@biomejs/cli-darwin-arm64@2.6.6"
  - "@biomejs/cli-darwin-x64@2.6.6"
  - "@biomejs/cli-linux-arm64-musl@2.6.6"
  - "@biomejs/cli-linux-arm64@2.6.6"
  - "@biomejs/cli-linux-x64-musl@2.6.6"
  - "@biomejs/cli-linux-x64@2.6.6"
  - "@biomejs/cli-win32-arm64@2.6.6"
  - "@biomejs/cli-win32-x64@2.6.6"
  - "@playwright/test@1.65.0"
  - bullmq@6.7.1
  - lucide-react@1.70.0
  - playwright-core@1.65.0
  - playwright@1.65.0
  - postgres@4.1.0
allowBuilds:
  esbuild: true
  sharp: true
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/darwin-arm64": true
  msgpackr-extract: false
