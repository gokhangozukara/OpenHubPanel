name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:db
      - run: pnpm audit --audit-level=moderate
      - run: pnpm scan:secrets
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
      - name: Scan full Git history with Gitleaks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.0_checksums.txt
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build -f infra/docker/Dockerfile -t openhubpanel:ci .
      - name: Verify production preview is closed
        shell: bash
        run: |
          docker run -d --rm --name openhub-ci -e OPENHUB_PREVIEW=1 -p 127.0.0.1:3200:3000 openhubpanel:ci
          trap 'docker stop openhub-ci' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3200/api/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/preview)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/api/internal/ready)" = 404
      - name: Validate development Compose configuration
        run: |
          node scripts/setup-env.mjs
          docker compose --env-file .env -f infra/docker/compose.yml config --quiet
      - name: Verify PostgreSQL and Redis readiness and fail-closed behavior
        shell: bash
        run: |
          set -eu
          docker compose --env-file .env -f infra/docker/compose.yml up -d --wait
          trap 'docker stop openhub-ready || true; docker compose --env-file .env -f infra/docker/compose.yml down' EXIT
          set -a
          source .env
          set +a
          docker run -d --rm --name openhub-ready --network openhubpanel_default \
            --env-file .env -e APP_ORIGIN=https://panel.example \
            -e DATABASE_URL="postgresql://openhub_app:${APP_DATABASE_PASSWORD}@postgres:5432/openhubpanel" \
            -e REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379" \
            -p 127.0.0.1:3201:3000 openhubpanel:ci
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3201/api/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${READINESS_TOKEN}" http://127.0.0.1:3201/api/internal/ready)" = 200
          invalid_token=invalid
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${invalid_token}" http://127.0.0.1:3201/api/internal/ready)" = 404
          docker compose --env-file .env -f infra/docker/compose.yml stop redis
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${READINESS_TOKEN}" http://127.0.0.1:3201/api/internal/ready)" = 503
